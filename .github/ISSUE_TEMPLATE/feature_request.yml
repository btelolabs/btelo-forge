name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Video editor / export
        - Drawing / artboards
        - Mind map
        - Office documents (docx, xlsx, pptx, PDF)
        - 3D model
        - Live stream / recording
        - AI models / chat
        - Files / resource manager
        - Keyboard tool
        - Music library / downloads
        - Speech / transcription / voice-over
        - Printing
        - Settings / updates / start page
        - MCP tools
        - A new tool
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, not only the solution.
      placeholder: "I often need to ..., but ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: How it could work. A sketch, a reference to another app, or an example file helps.
  - type: markdown
    attributes:
      value: |
        New music sites, speech models and streaming platforms are plain JSON settings. Name the site or model and a link, and it can be added.
