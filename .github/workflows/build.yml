name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="dev-${GITHUB_SHA::7}"
          for arch in amd64 arm64; do
            mkdir -p "dist/btelo-cut-windows-$arch"
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$version" \
              -o "dist/btelo-cut-windows-$arch/btelo-video-cut.exe" ./cmd/btelo-video-cut
            cp LICENSE NOTICE README.md README.zh-CN.md THIRD_PARTY_NOTICES.md "dist/btelo-cut-windows-$arch/"
            (cd dist && 7z a -tzip "btelo-cut-windows-$arch.zip" "btelo-cut-windows-$arch" > /dev/null)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="dev-${GITHUB_SHA::7}"
          short="${version#v}"
          [[ "$short" =~ ^[0-9] ]] || short="0.0.0"
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "build/btelo-video-cut-$arch" ./cmd/btelo-video-cut
          done
          app="dist/btelo-cut-macos/btelo-video-cut.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/btelo-video-cut" build/btelo-video-cut-arm64 build/btelo-video-cut-amd64
          sed "s/VERSION/$short/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=build/AppIcon.iconset
          mkdir -p "$iconset"
          cp docs/logo.png build/logo.png
          for size in 16 32 128 256 512; do
            sips -z $size $size build/logo.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) build/logo.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$app"
          cp LICENSE NOTICE README.md README.zh-CN.md THIRD_PARTY_NOTICES.md dist/btelo-cut-macos/
          (cd dist && ditto -c -k --sequesterRsrc --keepParent btelo-cut-macos btelo-cut-macos.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/btelo-cut-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
